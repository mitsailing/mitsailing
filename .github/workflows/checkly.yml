name: Checkly

on: [deployment_status]

env:
  CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
  CHECKLY_ACCOUNT_ID: ${{ secrets.CHECKLY_ACCOUNT_ID }}
  CHECKLY_REPO_URL: https://github.com/mitsailing/mitsailing
  CHECKLY_TEST_ENVIRONMENT: ${{ github.event.deployment_status.environment }}
  ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url || 'https://mitsailing.com' }}
  HEALTHCHECK_SECRET: ${{ secrets.HEALTHCHECK_SECRET }}

jobs:
  deploy-health-checks:
    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    # Only run after a successful production deployment.
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'production'

    name: Deploy Checkly health checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Note readiness monitoring scope
        run: |
          if [ -z "${HEALTHCHECK_SECRET}" ]; then
            echo "::notice::HEALTHCHECK_SECRET is not configured. Checkly will run public checks and skip protected readiness checks."
          fi

      - uses: actions/checkout@v6
        with:
          ref: '${{ github.event.deployment.sha || github.event.deployment_status.deployment.sha }}'
          fetch-depth: 0

      - name: Set Checkly git metadata
        run: |
          echo "CHECKLY_REPO_BRANCH=${{ github.event.deployment.ref || github.event.deployment_status.deployment.ref }}" >> "$GITHUB_ENV"
          echo "CHECKLY_REPO_SHA=${{ github.event.deployment.sha || github.event.deployment_status.deployment.sha }}" >> "$GITHUB_ENV"

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run checks
        id: run-checks
        run: npx dotenv -c production -- npx checkly test --reporter=github --record

      - name: Create summary
        id: create-summary
        if: always()
        run: |
          if [ -f checkly-github-report.md ]; then
            cat checkly-github-report.md > "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy checks
        id: deploy-checks
        if: steps.run-checks.outcome == 'success'
        run: npx dotenv -c production -- npx checkly deploy --force
