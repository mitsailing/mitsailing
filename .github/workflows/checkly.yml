name: Checkly

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkly-production
  cancel-in-progress: true

jobs:
  deploy-health-checks:
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    name: Deploy Checkly health checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
      CHECKLY_ACCOUNT_ID: ${{ secrets.CHECKLY_ACCOUNT_ID }}
      CHECKLY_REPO_URL: https://github.com/mitsailing/mitsailing
      CHECKLY_TEST_ENVIRONMENT: production
      ENVIRONMENT_URL: https://mitsailing.com
      HEALTHCHECK_SECRET: ${{ secrets.HEALTHCHECK_SECRET }}

    steps:
      - name: Note readiness monitoring scope
        run: |
          if [ -z "${HEALTHCHECK_SECRET}" ]; then
            echo "::notice::HEALTHCHECK_SECRET is not configured. Checkly will run public checks and skip protected readiness checks."
          fi

      - uses: actions/checkout@v6
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 0
          persist-credentials: false

      - name: Set Checkly git metadata
        env:
          CHECKLY_REPO_BRANCH: ${{ github.ref_name }}
          CHECKLY_REPO_SHA: ${{ github.sha }}
        run: |
          printf 'CHECKLY_REPO_BRANCH=%s\n' "$CHECKLY_REPO_BRANCH" >> "$GITHUB_ENV"
          printf 'CHECKLY_REPO_SHA=%s\n' "$CHECKLY_REPO_SHA" >> "$GITHUB_ENV"

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run checks
        id: run-checks
        run: npx dotenv -c production -- npx checkly test --reporter=github --record

      - name: Create summary
        id: create-summary
        if: always()
        run: |
          if [ -f checkly-github-report.md ]; then
            cat checkly-github-report.md > "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy checks
        id: deploy-checks
        if: steps.run-checks.outcome == 'success' && github.ref == 'refs/heads/main'
        run: npx dotenv -c production -- npx checkly deploy --force
