name: Deploy (production)

# Repository → Settings → Environments → `production`:
#   Add **Required reviewers** so the deploy job waits for human approval before
#   SSH (recommended). Secrets live on that environment:
#   PRODUCTION_SSH_TARGET, PRODUCTION_SSH_PRIVATE_KEY, PRODUCTION_SSH_HOST_KEY,
#   NEXT_PUBLIC_SENTRY_DSN, SENTRY_AUTH_TOKEN
#   (see docs/deploy.md). The `build` job uses this environment so those values
#   reach the image build.
#
# Auto-deploy to the production host when main changes. We also
# expose a manual `workflow_dispatch` trigger so operators can deploy an
# arbitrary commit without having to git-push (useful for hotfix replays
# and rollback by SHA).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA to deploy (default: latest main)'
        required: false
        default: ''

# Cancel an in-flight deploy when a newer push lands so `main` converges
# on the latest commit rather than racing between slower and newer runs.
concurrency:
  group: deploy-production
  cancel-in-progress: true

# Default read-only token; `build` job overrides with packages + attestations.
# https://docs.github.com/en/actions/security-guides/automatic-token-authentication
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────── Stage 1 — build image ───────────────────
  # One build per deploy. The Dockerfile itself builds and bundles,
  # so we don't repeat `npm run build` in the workflow. Relying on
  # Docker's BuildKit cache (actions/cache-backed) keeps subsequent
  # deploys fast.
  build:
    name: Build + push image
    runs-on: ubuntu-latest
    # Production environment secrets (`NEXT_PUBLIC_SENTRY_DSN`, `SENTRY_AUTH_TOKEN`, …).
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # needed to push to ghcr.io under the repo's namespace
      id-token: write # OIDC for signed provenance + SBOM attestations
      attestations: write # write attestations to the repo's attestation store
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_digest: ${{ steps.build.outputs.digest }}
      deployment_version: ${{ steps.meta.outputs.deployment_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        # Two tags per build:
        #   - sha-<shortsha>  : immutable, used for rollback / auditing
        #   - latest          : floating, what deploy.sh defaults to
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          short_sha="${checked_out_sha::12}"
          repo="$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_sha=${{ env.REGISTRY }}/${repo}:sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image_floating=${{ env.REGISTRY }}/${repo}:latest"     >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${short_sha}"                            >> "$GITHUB_OUTPUT"
          echo "deployment_version=${checked_out_sha}"                  >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push prod image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          # Next inlines `NEXT_PUBLIC_*` at `next build`, which runs in this
          # job — not on the production host. Server `.env.production` does not
          # affect the bundle; keep it aligned with this URL for runtime Env.
          # Sentry secrets live on the `production` GitHub environment (see docs/deploy.md).
          build-args: |
            NEXT_PUBLIC_APP_URL=https://mitsailing.com
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_DISABLED=
            DEPLOYMENT_VERSION=${{ steps.meta.outputs.deployment_version }}
          # `provenance: mode=max` below publishes build-arg values in the image
          # attestation, so the source-map upload token goes in as a secret mount
          # instead — those are excluded from provenance and from image layers.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ${{ steps.meta.outputs.image_sha }}
            ${{ steps.meta.outputs.image_floating }}
          # GitHub cache backend avoids the Docker Hub rate-limit and is
          # free for public and private repos alike.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SLSA build provenance + in-toto SBOM are rendered by GHCR's
          # package UI and consumable by `gh attestation verify`. 2026
          # supply-chain default for self-hosted deploys.
          provenance: mode=max
          sbom: true

      # Separate signed attestation via sigstore, stored in the repo's
      # attestation log. Complements the in-image attestations above so
      # consumers can verify with `gh attestation verify` without pulling
      # the image.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.meta.outputs.image_sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  # ─────────────────── Stage 2 — release ───────────────────
  # `bin/deploy.sh release` runs the replacement MIT Sailing stack on the
  # production host. WordPress has a separate tunnel/deploy path.
  deploy:
    name: Release production
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 35
    # Host `docker pull` of the private GHCR package needs packages:read.
    # Build already pushed with packages:write; this job only pulls.
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://mitsailing.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pin all production host keys to prevent MITM. This secret may hold
          # multiple ssh-keyscan lines for the production host, including rotated host keys.
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync production deploy files
        env:
          PRODUCTION_SSH_TARGET: ${{ secrets.PRODUCTION_SSH_TARGET }}
          REMOTE_APP_DIR: ${{ vars.PRODUCTION_REMOTE_APP_DIR || 'apps/mitsailing' }}
        run: |
          set -euo pipefail
          . .github/scripts/validate_remote_app_dir.sh
          validate_remote_app_dir
          printf -v remote_app_dir '%q' "$REMOTE_APP_DIR"

          ssh \
            -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$PRODUCTION_SSH_TARGET" \
            "mkdir -p ${remote_app_dir}/bin ${remote_app_dir}/docker/postgres ${remote_app_dir}/docker/nginx"

          scp \
            -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            compose.yaml \
            compose.prod.yaml \
            "$PRODUCTION_SSH_TARGET:${REMOTE_APP_DIR}/"

          scp \
            -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            bin/deploy.sh \
            "$PRODUCTION_SSH_TARGET:${REMOTE_APP_DIR}/bin/deploy.sh"

          scp \
            -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            docker/postgres/init.sql \
            "$PRODUCTION_SSH_TARGET:${REMOTE_APP_DIR}/docker/postgres/init.sql"

          scp \
            -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            docker/nginx/media.conf \
            "$PRODUCTION_SSH_TARGET:${REMOTE_APP_DIR}/docker/nginx/media.conf"

          ssh \
            -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$PRODUCTION_SSH_TARGET" \
            "chmod 755 ${remote_app_dir}/bin ${remote_app_dir}/docker ${remote_app_dir}/docker/postgres ${remote_app_dir}/docker/nginx && chmod 700 ${remote_app_dir}/bin/deploy.sh && chmod 644 ${remote_app_dir}/compose.yaml ${remote_app_dir}/compose.prod.yaml ${remote_app_dir}/docker/postgres/init.sql ${remote_app_dir}/docker/nginx/media.conf"

      # GHCR package visibility is independent of the public git repo and defaults
      # to private. Prefer short-lived GITHUB_TOKEN (packages:read) over a host PAT.
      # Pipe the token over SSH stdin into `docker login --password-stdin`.
      # Per-run DOCKER_CONFIG keeps GHCR auth off the shared ~/.docker config;
      # DOCKER_HOST points at the rootless socket when that context is not loaded.
      - name: Log in to GHCR on production host
        id: ghcr_login
        env:
          PRODUCTION_SSH_TARGET: ${{ secrets.PRODUCTION_SSH_TARGET }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REMOTE_DOCKER_CONFIG: /tmp/mitsailing-ghcr-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          printf -v remote_user '%q' "$GHCR_USERNAME"
          printf -v remote_docker_config '%q' "$REMOTE_DOCKER_CONFIG"
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o RequestTTY=no \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$PRODUCTION_SSH_TARGET" \
            "bash -c 'set -euo pipefail; mkdir -p -m 700 ${remote_docker_config}; export DOCKER_CONFIG=${remote_docker_config}; sock=\"/run/user/\$(id -u)/docker.sock\"; if [[ -S \"\$sock\" ]]; then export DOCKER_HOST=\"unix://\$sock\"; fi; docker login ghcr.io -u ${remote_user} --password-stdin'"
          unset GHCR_TOKEN

      - name: Release
        env:
          PRODUCTION_SSH_TARGET: ${{ secrets.PRODUCTION_SSH_TARGET }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          REMOTE_APP_DIR: ${{ vars.PRODUCTION_REMOTE_APP_DIR || 'apps/mitsailing' }}
          PRODUCTION_DATA_ROOT: ${{ vars.PRODUCTION_DATA_ROOT }}
          REMOTE_DOCKER_CONFIG: /tmp/mitsailing-ghcr-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          . .github/scripts/validate_remote_app_dir.sh
          validate_remote_app_dir
          remote_data_root_assignment=
          if [[ -n "$PRODUCTION_DATA_ROOT" ]]; then
            printf -v remote_data_root '%q' "$PRODUCTION_DATA_ROOT"
            remote_data_root_assignment="PRODUCTION_DATA_ROOT=${remote_data_root} "
          fi

          printf -v remote_app_dir '%q' "$REMOTE_APP_DIR"
          printf -v remote_deploy_script '%q' "${REMOTE_APP_DIR}/bin/deploy.sh"
          printf -v remote_image_tag '%q' "$IMAGE_TAG"
          printf -v remote_docker_config '%q' "$REMOTE_DOCKER_CONFIG"

          ssh \
            -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$PRODUCTION_SSH_TARGET" \
            "bash -c 'set -euo pipefail; export DOCKER_CONFIG=${remote_docker_config}; sock=\"/run/user/\$(id -u)/docker.sock\"; if [[ -S \"\$sock\" ]]; then export DOCKER_HOST=\"unix://\$sock\"; fi; ${remote_data_root_assignment}DEPLOY_DIR=${remote_app_dir} ${remote_deploy_script} release ${remote_image_tag}'"

      - name: Log out of GHCR on production host
        if: ${{ always() && steps.ghcr_login.outcome == 'success' }}
        env:
          PRODUCTION_SSH_TARGET: ${{ secrets.PRODUCTION_SSH_TARGET }}
          REMOTE_DOCKER_CONFIG: /tmp/mitsailing-ghcr-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          printf -v remote_docker_config '%q' "$REMOTE_DOCKER_CONFIG"
          ssh \
            -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o RequestTTY=no \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$PRODUCTION_SSH_TARGET" \
            "DOCKER_CONFIG=${remote_docker_config} docker logout ghcr.io; rm -rf ${remote_docker_config}"

      # Marks the release as deployed only after the host is actually serving
      # it, which is what makes regressions and "resolved in next release"
      # meaningful. `release` must match the DEPLOYMENT_VERSION the image was
      # built with; the build plugin already created and finalized the release.
      - name: Record Sentry deploy
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: mit-sailing
          SENTRY_PROJECT: javascript-nextjs
        with:
          release: ${{ needs.build.outputs.deployment_version }}
          environment: production
          # The build plugin already created, finalized, and associated commits
          # for this release; this step only adds the deploy.
          finalize: false
          set_commits: skip
