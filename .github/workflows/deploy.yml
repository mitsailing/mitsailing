name: Deploy (production)

# Repository → Settings → Environments → `production`:
#   Add **Required reviewers** so the deploy job waits for human approval before
#   SSH (recommended). Secrets live on that environment: PRODUCTION_SSH_*.
#
# Auto-deploy to the sailing-dock production host when main changes. We also
# expose a manual `workflow_dispatch` trigger so operators can deploy an
# arbitrary commit without having to git-push (useful for hotfix replays
# and rollback by SHA).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA to deploy (default: latest main)'
        required: false
        default: ''

# Cancel an in-flight deploy when a newer push lands so `main` converges
# on the latest commit rather than racing between slower and newer runs.
concurrency:
  group: deploy-production
  cancel-in-progress: true

# Default read-only token; `build` job overrides with packages + attestations.
# https://docs.github.com/en/actions/security-guides/automatic-token-authentication
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────── Stage 1 — build image ───────────────────
  # One build per deploy. The Dockerfile itself builds and bundles,
  # so we don't repeat `npm run build` in the workflow. Relying on
  # Docker's BuildKit cache (actions/cache-backed) keeps subsequent
  # deploys fast.
  build:
    name: Build + push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # needed to push to ghcr.io under the repo's namespace
      id-token: write # OIDC for signed provenance + SBOM attestations
      attestations: write # write attestations to the repo's attestation store
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        # Two tags per build:
        #   - sha-<shortsha>  : immutable, used for rollback / auditing
        #   - latest          : floating, what deploy.sh defaults to
        run: |
          short_sha="${GITHUB_SHA::12}"
          repo="$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_sha=${{ env.REGISTRY }}/${repo}:sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image_floating=${{ env.REGISTRY }}/${repo}:latest"     >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${short_sha}"                            >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push prod image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: |
            ${{ steps.meta.outputs.image_sha }}
            ${{ steps.meta.outputs.image_floating }}
          # GitHub cache backend avoids the Docker Hub rate-limit and is
          # free for public and private repos alike.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SLSA build provenance + in-toto SBOM are rendered by GHCR's
          # package UI and consumable by `gh attestation verify`. 2026
          # supply-chain default for self-hosted deploys.
          provenance: mode=max
          sbom: true

      # Separate signed attestation via sigstore, stored in the repo's
      # attestation log. Complements the in-image attestations above so
      # consumers can verify with `gh attestation verify` without pulling
      # the image.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.meta.outputs.image_sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  # ─────────────────── Stage 2 — migrations ───────────────────
  # Run Prisma migrations before app rollout. This follows Prisma's
  # recommended "migrate deploy in CI/CD" pattern while still executing on
  # the production host network over SSH.
  migrate:
    name: Run production migrations
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: production
      url: https://mitsailing.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync deploy script
        env:
          PRODUCTION_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
        run: |
          scp \
            -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            bin/deploy.sh \
            "${PRODUCTION_USER}@${PRODUCTION_HOST}:~/deploy.sh"
          ssh \
            -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
            "chmod +x ~/deploy.sh"

      - name: Run prisma migrate deploy
        env:
          PRODUCTION_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          ssh \
            -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
            "~/deploy.sh migrate ${IMAGE_TAG}"

  # ─────────────────── Stage 3 — deploy ───────────────────
  # Separate job so a failed deploy doesn't block later pushes from
  # rebuilding the image. Uses `environment: production` so GitHub surfaces
  # the deploy in the Environments tab with a link + logs.
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: [build, migrate]
    timeout-minutes: 10
    environment:
      name: production
      url: https://mitsailing.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up SSH
        # We do NOT use ssh-agent for this; the deploy key is bound to a
        # single command on the server side (see docs/deploy.md), so only
        # the one authorized invocation below is possible.
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pin the host key to prevent MITM; the admin records this once
          # via `ssh-keyscan sailing-dock.mit.edu` and puts it in secrets.
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync deploy script
        env:
          PRODUCTION_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
        run: |
          scp \
            -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            bin/deploy.sh \
            "${PRODUCTION_USER}@${PRODUCTION_HOST}:~/deploy.sh"
          ssh \
            -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
            "chmod +x ~/deploy.sh"

      - name: Deploy
        env:
          PRODUCTION_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        # The remote side enforces `command="deploy.sh ..."` in
        # authorized_keys, so whatever we send here is re-parsed by the
        # deploy script. The script rejects anything that isn't
        # `deploy <ref>`.
        run: |
          ssh \
            -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
            "~/deploy.sh deploy ${IMAGE_TAG}"
