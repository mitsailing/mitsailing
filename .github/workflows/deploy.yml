name: Deploy (staging)

# Auto-deploy to the sailing-dock staging host when main changes. We also
# expose a manual `workflow_dispatch` trigger so operators can deploy an
# arbitrary commit without having to git-push (useful for hotfix replays
# and rollback by SHA).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA to deploy (default: latest main)'
        required: false
        default: ''

# Cancel an in-flight deploy when a newer push lands so `main` converges
# on the latest commit rather than racing between slower and newer runs.
concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────── Stage 1 — build image ───────────────────
  # One build per deploy. The Dockerfile itself builds and bundles,
  # so we don't repeat `npm run build` in the workflow. Relying on
  # Docker's BuildKit cache (actions/cache-backed) keeps subsequent
  # deploys fast.
  build:
    name: Build + push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # needed to push to ghcr.io under the repo's namespace
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        # Two tags per build:
        #   - sha-<shortsha>  : immutable, used for rollback / auditing
        #   - staging         : floating, what deploy.sh defaults to
        run: |
          short_sha="${GITHUB_SHA::12}"
          repo="$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_sha=${{ env.REGISTRY }}/${repo}:sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image_floating=${{ env.REGISTRY }}/${repo}:staging"    >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${short_sha}"                            >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push prod image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: |
            ${{ steps.meta.outputs.image_sha }}
            ${{ steps.meta.outputs.image_floating }}
          # GitHub cache backend avoids the Docker Hub rate-limit and is
          # free for public and private repos alike.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false # keeps GHCR UI tidy; flip on once registry UI supports it

  # ─────────────────── Stage 2 — deploy ───────────────────
  # Separate job so a failed deploy doesn't block later pushes from
  # rebuilding the image. Uses `environment: staging` so GitHub surfaces
  # the deploy in the Environments tab with a link + logs.
  deploy:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: staging
      url: https://mitsailing.com
    steps:
      - name: Set up SSH
        # We do NOT use ssh-agent for this; the deploy key is bound to a
        # single command on the server side (see docs/deploy.md), so only
        # the one authorized invocation below is possible.
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pin the host key to prevent MITM; the admin records this once
          # via `ssh-keyscan sailing-dock.mit.edu` and puts it in secrets.
          printf '%s\n' "${{ secrets.STAGING_SSH_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          STAGING_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_HOST: ${{ secrets.STAGING_SSH_HOST }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        # The remote side enforces `command="deploy.sh ..."` in
        # authorized_keys, so whatever we send here is re-parsed by the
        # deploy script. The script rejects anything that isn't
        # `deploy <ref>`.
        run: |
          ssh \
            -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "${STAGING_USER}@${STAGING_HOST}" \
            "deploy ${IMAGE_TAG}"
