name: Deploy (production)

# Repository → Settings → Environments → `production`:
#   Add **Required reviewers** so the deploy job waits for human approval before
#   SSH (recommended). Secrets live on that environment:
#   PRODUCTION_APP_HOST_BLUE, PRODUCTION_APP_HOST_GREEN,
#   PRODUCTION_DATA_MEDIA_HOST, PRODUCTION_SSH_PRIVATE_KEY,
#   PRODUCTION_SSH_HOST_KEY, NEXT_PUBLIC_SENTRY_DSN, SENTRY_AUTH_TOKEN
#   (see docs/deploy.md). The `build` job uses this environment so those values
#   reach Docker build-args.
#
# Auto-deploy to the sailing-dock production host when main changes. We also
# expose a manual `workflow_dispatch` trigger so operators can deploy an
# arbitrary commit without having to git-push (useful for hotfix replays
# and rollback by SHA).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA to deploy (default: latest main)'
        required: false
        default: ''

# Cancel an in-flight deploy when a newer push lands so `main` converges
# on the latest commit rather than racing between slower and newer runs.
concurrency:
  group: deploy-production
  cancel-in-progress: true

# Default read-only token; `build` job overrides with packages + attestations.
# https://docs.github.com/en/actions/security-guides/automatic-token-authentication
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────── Stage 1 — build image ───────────────────
  # One build per deploy. The Dockerfile itself builds and bundles,
  # so we don't repeat `npm run build` in the workflow. Relying on
  # Docker's BuildKit cache (actions/cache-backed) keeps subsequent
  # deploys fast.
  build:
    name: Build + push image
    runs-on: ubuntu-latest
    # Production environment secrets (`NEXT_PUBLIC_SENTRY_DSN`, `SENTRY_AUTH_TOKEN`, …).
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # needed to push to ghcr.io under the repo's namespace
      id-token: write # OIDC for signed provenance + SBOM attestations
      attestations: write # write attestations to the repo's attestation store
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        # Two tags per build:
        #   - sha-<shortsha>  : immutable, used for rollback / auditing
        #   - latest          : floating, what deploy.sh defaults to
        run: |
          short_sha="${GITHUB_SHA::12}"
          repo="$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_sha=${{ env.REGISTRY }}/${repo}:sha-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image_floating=${{ env.REGISTRY }}/${repo}:latest"     >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${short_sha}"                            >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push prod image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          # Next inlines `NEXT_PUBLIC_*` at `next build`, which runs in this
          # job — not on the production host. Server `.env.production` does not
          # affect the bundle; keep it aligned with this URL for runtime Env.
          # Sentry secrets live on the `production` GitHub environment (see docs/deploy.md).
          build-args: |
            NEXT_PUBLIC_APP_URL=https://mitsailing.com
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_DISABLED=
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            DEPLOYMENT_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image_sha }}
            ${{ steps.meta.outputs.image_floating }}
          # GitHub cache backend avoids the Docker Hub rate-limit and is
          # free for public and private repos alike.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SLSA build provenance + in-toto SBOM are rendered by GHCR's
          # package UI and consumable by `gh attestation verify`. 2026
          # supply-chain default for self-hosted deploys.
          provenance: mode=max
          sbom: true

      # Separate signed attestation via sigstore, stored in the repo's
      # attestation log. Complements the in-image attestations above so
      # consumers can verify with `gh attestation verify` without pulling
      # the image.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.meta.outputs.image_sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  # ─────────────────── Stage 2 — release ───────────────────
  # `deploy-two-host.sh release` holds a data/media-server lock across
  # migrations, host promotion, worker restart, and upload-safe app-host drain.
  deploy:
    name: Release production
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 35
    environment:
      name: production
      url: https://mitsailing.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pin all production host keys to prevent MITM. This secret may hold
          # multiple ssh-keyscan lines: blue app host, green app host, data/media host.
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync two-host deploy files
        env:
          APP_HOST_BLUE: ${{ secrets.PRODUCTION_APP_HOST_BLUE }}
          APP_HOST_GREEN: ${{ secrets.PRODUCTION_APP_HOST_GREEN }}
          DATA_MEDIA_HOST: ${{ secrets.PRODUCTION_DATA_MEDIA_HOST }}
          REMOTE_APP_DIR: ${{ vars.PRODUCTION_REMOTE_APP_DIR || 'apps/mitsailing' }}
        run: |
          set -euo pipefail
          for target in "$APP_HOST_BLUE" "$APP_HOST_GREEN" "$DATA_MEDIA_HOST"; do
            ssh \
              -i ~/.ssh/id_deploy \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              "$target" \
              "mkdir -p '${REMOTE_APP_DIR}/docker/postgres' '${REMOTE_APP_DIR}/docker/nginx'"

            scp \
              -i ~/.ssh/id_deploy \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              compose.yaml \
              compose.prod.yaml \
              compose.prod.app-host.yaml \
              compose.prod.data.yaml \
              "$target:${REMOTE_APP_DIR}/"

            scp \
              -i ~/.ssh/id_deploy \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              docker/postgres/init.sql \
              "$target:${REMOTE_APP_DIR}/docker/postgres/init.sql"

            scp \
              -i ~/.ssh/id_deploy \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              docker/nginx/media.conf \
              "$target:${REMOTE_APP_DIR}/docker/nginx/media.conf"
          done

      - name: Release
        env:
          APP_HOST_BLUE: ${{ secrets.PRODUCTION_APP_HOST_BLUE }}
          APP_HOST_GREEN: ${{ secrets.PRODUCTION_APP_HOST_GREEN }}
          DATA_MEDIA_HOST: ${{ secrets.PRODUCTION_DATA_MEDIA_HOST }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          REMOTE_APP_DIR: ${{ vars.PRODUCTION_REMOTE_APP_DIR || 'apps/mitsailing' }}
        run: |
          chmod +x bin/deploy-two-host.sh
          ./bin/deploy-two-host.sh release "$IMAGE_TAG"
