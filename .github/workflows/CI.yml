name: CI

# Runs only on pull requests targeting `main`. Post-merge CI is intentionally
# disabled — the branch-protection ruleset (`.github/rulesets/main-branch.json`)
# requires these same checks to pass on the PR before merge (`Run E2E tests` is
# the `e2e-required` fan-in after sharded Playwright jobs), so re-running them
# on the merge commit would just duplicate ~15–20 min of work per PR.
#
# `release.yml` triggers directly on `push: main` (not `workflow_run: CI`) so
# semantic-release still fires after merges. `deploy.yml` and `checkly.yml` are
# likewise independent of CI.yml.
on:
  pull_request:
    branches: [main]

# Human-readable run title (numeric id only — avoids expression injection in titles).
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#run-name
run-name: CI PR #${{ github.event.pull_request.number }}

# Cancel in-flight runs when a newer commit lands on the same PR. Avoids
# stacking runners on noisy branches; relies on runtime > startup cost.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN — grant extra scopes on jobs that need them.
# https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
permissions:
  contents: read

# Env shared by every job. `build` uses the Postgres service container; `e2e`
# uses docker-compose Postgres + Mailpit via `e2e:preflight` in package.json.
env:
  BETTER_AUTH_SECRET: ci-placeholder-auth-secret-min-32-chars-long!!
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dev_db?sslmode=disable
  TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test_db?sslmode=disable
  # Route transactional mail to Mailpit during CI e2e flows.
  MAIL_TRANSPORT: smtp
  SMTP_URL: smtp://127.0.0.1:1025
  MAILPIT_API_URL: http://127.0.0.1:8025
  EMAIL_FROM: ci@example.com
  SUPPORT_EMAIL: support@example.com
  # Required by `src/libs/Env.ts` whenever tests import code that touches Env.
  NEXT_PUBLIC_APP_URL: http://localhost:3008
  # Bootstrap an admin user during `prisma db seed` in e2e preflight (see prisma/seed.ts).
  ADMIN_EMAIL: e2e-admin@example.com
  ADMIN_PASSWORD: 'Correct-Horse-Battery-Staple-E2E-32!!'
  NODE_VERSION: 24.x

jobs:
  build:
    strategy:
      matrix:
        # Single version: matches production Docker / server (Node 24).
        node-version: [24.x]

    name: Build with ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # build-local runs prisma migrate; needs Postgres without relying on
    # docker compose on the runner (matches DATABASE_URL in workflow env).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dev_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dev_db"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    # GITHUB_TOKEN: cache restore/save (actions/cache).
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore or cache Next.js build
        uses: actions/cache@v5
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: nextjs-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**') }}

      - name: Build Next.js
        run: npm run build-local
        env:
          NEXT_PUBLIC_SENTRY_DISABLED: 'true' # Only upload Sentry source maps in deployment
          NEXT_PUBLIC_APP_URL: http://localhost:3008
          IS_E2E: '1'

      # Records the inlined public origin so `E2E_SKIP_BUILD=1` never reuses a
      # `.next` built for a different NEXT_PUBLIC_APP_URL (Better Auth INVALID_ORIGIN).
      - name: Mark Next output for E2E skip-build
        if: success()
        run: node scripts/e2e-build.cjs --write-e2e-ready-marker

      - if: success()
        name: Cache Next.js build output
        uses: actions/cache/save@v5
        with:
          path: |
            .next
            next-env.d.ts
          key: nextjs-build-${{ matrix.node-version }}-${{ github.sha }}

  unit:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Codecov OIDC + artifact uploads + npm cache (setup-project).
    permissions:
      contents: read
      actions: read
      id-token: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit tests (with coverage)
        run: npm run test:coverage
        env:
          COVERAGE_BASE_REF: HEAD^1

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
          files: ./coverage/lcov.info
          flags: unittests

      # Codecov is deprecating the standalone test-results-action; the
      # replacement is codecov-action@v6 with report_type=test_results.
      - name: Upload test results to Codecov (Test Analytics)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
          files: ./test-report.junit.xml
          flags: unittests
          report_type: test_results

      # Codacy coverage is additive to Codecov here: Codacy uses the same LCOV
      # artifact already generated by `npm run test:coverage`.
      - name: Upload coverage reports to Codacy
        if: ${{ !cancelled() && env.CODACY_PROJECT_TOKEN != '' }}
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage/lcov.info

      - name: Upload coverage reports to Codacy with account token
        if: ${{ !cancelled() && env.CODACY_PROJECT_TOKEN == '' && env.CODACY_API_TOKEN != '' }}
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: coverage/lcov.info

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/coverage-final.json
            coverage/coverage-summary.json
            test-report.junit.xml
          if-no-files-found: warn
          retention-days: 14

  integration:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 12

    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run integration test lifecycle (db up -> migrate -> test)
        run: npm run test:integration

      - name: Always teardown integration DB services
        if: always()
        run: npm run db:test:down

  storybook:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify Chrome channel
        run: google-chrome-stable --version || google-chrome --version

      - name: Run storybook tests
        run: npm run storybook:test

  static:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]

    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Retrieve Git history, needed to verify commits

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}
          restore-nextjs-cache: true

      - if: github.event_name == 'pull_request'
        name: Validate all commits from PR
        run: npx commitlint --from $BASE_SHA --to $HEAD_SHA --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Linter
        run: npm run lint

      # Ultracite's `--type-check` only covers files matching its glob.
      # `check:types` runs `tsc --noEmit` across the full project so type
      # errors in files Ultracite skips (scripts/, emails/, etc.) still fail CI.
      - name: Typecheck (tsc --noEmit)
        run: npm run check:types

      - name: Check dependencies
        run: npm run check:deps

      - name: I18n check
        run: npm run check:i18n

  e2e:
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
        shardIndex: [1, 2, 3]
        shardTotal: [3]

    name: Run E2E shard (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]

    permissions:
      contents: read
      actions: read
      artifact-metadata: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # For chromatic

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}
          restore-nextjs-cache: true

      # Chromium-only on the PR gate (faster CI, matches deploy engine). The
      # `firefox` Playwright project is omitted unless PLAYWRIGHT_INCLUDE_FIREFOX=1
      # and `npx playwright install firefox --with-deps` — see e2e-verification.mdc.
      - name: Verify Chrome channel
        run: google-chrome-stable --version || google-chrome --version

      # Run e2e tests directly on the runner so the Playwright process can
      # reach the docker-compose services on localhost:5432 / localhost:1025
      # (a `uses: docker://` step would run in an isolated container that
      # cannot reach host services).
      - name: Run E2E preflight
        timeout-minutes: 3
        run: npm run e2e:preflight

      - name: Prepare cached E2E build
        timeout-minutes: 2
        run: npm run e2e:build
        env:
          E2E_SKIP_BUILD: '1' # .next restored from the `build` job; cal.com also builds before e2e, not inside the e2e script

      - name: Run E2E tests
        timeout-minutes: 5
        run: npm run e2e -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Fix test results permission # Give permissions to test results needed by Chromatic
        if: ${{ !cancelled() && hashFiles('test-results/**') != '' }}
        run: |
          sudo chmod -R 777 test-results

      - name: Run visual regression tests
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        uses: chromaui/action@v16
        with:
          playwright: true
          exitOnceUploaded: true # Speed up by skipping the build results
          outputDir: storybook-static
          projectToken: ${{ env.CHROMATIC_PROJECT_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('test-results/**') != '' }}
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: test-results/
          retention-days: 7

      - name: Upload blob report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('blob-report/**') != '' }}
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 7

      - name: Always teardown E2E DB services
        if: always()
        run: npm run db:test:down

  # Fan-in after the sharded `e2e` matrix: a job that `needs` a matrix parent
  # waits for every matrix leg to finish successfully (GitHub Actions dependency
  # semantics). Exposes one stable check name for branch rulesets; shard labels
  # stay on the matrix jobs for debugging.
  e2e-required:
    name: Run E2E tests (24.x)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [e2e]
    # `always()` is required so this job still runs when `e2e` is skipped (e.g.
    # `build` failed) and can fail the gate; `!cancelled()` alone does not run
    # dependents of skipped jobs. See GitHub Actions "Skipping job applications".
    if: ${{ always() }}
    steps:
      - name: Verify E2E shards
        run: |
          if [ "${E2E_RESULT}" != "success" ]; then
            echo "E2E shards finished with result: ${E2E_RESULT}"
            exit 1
          fi
          echo "All E2E shards completed successfully."
        env:
          E2E_RESULT: ${{ needs.e2e.result }}

  merge-e2e-reports:
    name: Merge E2E reports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [e2e]
    # Run even when e2e shards fail so the merged HTML report is still produced,
    # but skip on cancellation (the merge step checks out sources and could hang).
    # GitHub Actions docs recommend `!cancelled()` over `always()` for this case
    # (Status check functions > always).
    if: ${{ !cancelled() }}

    permissions:
      contents: read
      actions: read
      artifact-metadata: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download blob reports
        uses: actions/download-artifact@v7
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Check blob reports
        id: blob-reports
        run: |
          if find all-blob-reports -type f -name '*.zip' -print -quit 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Playwright blob reports were uploaded by the E2E shards."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge Playwright reports
        if: steps.blob-reports.outputs.found == 'true'
        timeout-minutes: 5
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged E2E report
        uses: actions/upload-artifact@v7
        if: always() && steps.blob-reports.outputs.found == 'true'
        with:
          name: playwright-report--attempt-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 7
