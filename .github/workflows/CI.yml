name: CI

# Runs only on pull requests targeting `main`. Post-merge CI is intentionally
# disabled — the branch-protection ruleset (`.github/rulesets/main-branch.json`)
# requires these same checks to pass on the PR before merge, so re-running them
# on the merge commit would just duplicate ~15–20 min of work per PR.
#
# `release.yml` triggers directly on `push: main` (not `workflow_run: CI`) so
# semantic-release still fires after merges. `deploy.yml` and `checkly.yml` are
# likewise independent of CI.yml.
on:
  pull_request:
    branches: [main]

# Cancel in-flight runs when a newer commit lands on the same PR. Avoids
# stacking runners on noisy branches; relies on runtime > startup cost.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Env shared by every job. Only the `e2e` job actually talks to Postgres —
# the rest (`build`, `unit`, `storybook`, `static`) never open a DB connection.
# `e2e:preflight` in `package.json` is what starts compose Postgres + Mailpit
# for the e2e job; no other job spins them up.
env:
  BETTER_AUTH_SECRET: ci-placeholder-auth-secret-min-32-chars-long!!
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dev_db?sslmode=disable
  TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test_db?sslmode=disable
  # Required by `src/libs/Env.ts` whenever tests import code that touches Env.
  NEXT_PUBLIC_APP_URL: http://localhost:3008

jobs:
  build:
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    name: Build with ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # build-local runs prisma migrate; needs Postgres without relying on
    # docker compose on the runner (matches DATABASE_URL in workflow env).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dev_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dev_db"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore or cache Next.js build
        uses: actions/cache@v5
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: nextjs-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**') }}

      - name: Build Next.js
        run: npm run build-local
        env:
          NEXT_PUBLIC_SENTRY_DISABLED: 'true' # Only upload Sentry source maps in deployment
          NEXT_PUBLIC_APP_URL: http://localhost:3008

      - if: matrix.node-version == '24.x' && success()
        name: Cache Next.js build output
        uses: actions/cache/save@v5
        with:
          path: |
            .next
            next-env.d.ts
          key: nextjs-build-${{ matrix.node-version }}-${{ github.sha }}

  unit:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Codecov OIDC: GitHub mints a short-lived id-token for Codecov to verify.
    # This is the 2026-preferred auth for public repos — no CODECOV_TOKEN needed.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit tests (with coverage)
        uses: docker://mcr.microsoft.com/playwright:v1.58.2
        with:
          args: npm run test:coverage

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
          files: ./coverage/lcov.info
          flags: unittests

      # Codecov is deprecating the standalone test-results-action; the
      # replacement is codecov-action@v6 with report_type=test_results.
      - name: Upload test results to Codecov (Test Analytics)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
          files: ./test-report.junit.xml
          flags: unittests
          report_type: test_results

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/coverage-final.json
            coverage/coverage-summary.json
            test-report.junit.xml
          if-no-files-found: warn
          retention-days: 14

  storybook:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run storybook tests
        uses: docker://mcr.microsoft.com/playwright:v1.58.2
        with:
          args: npm run storybook:test

  static:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Retrieve Git history, needed to verify commits

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}
          restore-nextjs-cache: true

      - if: github.event_name == 'pull_request'
        name: Validate all commits from PR
        run: npx commitlint --from $BASE_SHA --to $HEAD_SHA --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Linter
        run: npm run lint

      # Ultracite's `--type-check` only covers files matching its glob.
      # `check:types` runs `tsc --noEmit` across the full project so type
      # errors in files Ultracite skips (scripts/, emails/, etc.) still fail CI.
      - name: Typecheck (tsc --noEmit)
        run: npm run check:types

      - name: Check dependencies
        run: npm run check:deps

      - name: I18n check
        run: npm run check:i18n

  e2e:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # For chromatic

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}
          restore-nextjs-cache: true

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      # Run e2e tests directly on the runner so the Playwright process can
      # reach the docker-compose services on localhost:5432 / localhost:1025
      # (a `uses: docker://` step would run in an isolated container that
      # cannot reach host services).
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: '1' # .next restored from the `build` job; cal.com also builds before e2e, not inside the e2e script

      - name: Fix test results permission # Give permissions to test results needed by Chromatic
        run: |
          sudo chmod -R 777 test-results

      - name: Run visual regression tests
        uses: chromaui/action@v16
        with:
          playwright: true
          exitOnceUploaded: true # Speed up by skipping the build results
          outputDir: storybook-static
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
