name: Release

# Triggers directly on `push: main` rather than chaining off `workflow_run: CI`.
# CI no longer runs on main (only on PRs — see `.github/workflows/CI.yml`), so
# a `workflow_run` trigger would never fire. The branch-protection ruleset
# (`.github/rulesets/main-branch.json`) already guarantees that every commit
# reaching `main` has passed the full PR check suite, so running semantic-
# release straight off the merge commit is safe.
on:
  push:
    branches: [main]

jobs:
  release:
    strategy:
      matrix:
        node-version: [24.x]

    name: Create a new release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
