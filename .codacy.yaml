---
# Keep Codacy exclusions scoped to generated, build, report, vendored, migration,
# policy prose, or documented analyzer-mismatch files. App-owned source findings
# should be fixed or triaged instead of hidden here.
# React TSX is covered by Codacy's Biome config in .biome.json.
exclude_paths:
  - '.next/**'
  - 'out/**'
  - 'coverage/**'
  - 'playwright-report/**'
  - 'blob-report/**'
  - 'test-results/**'
  - 'vitest-test-results/**'
  - 'storybook-static/**'
  - 'node_modules/**'
  - 'src/generated/**'
  - 'zenstack/**'
  - 'prisma/migrations/**'
  # Repo agent instructions are policy prose, not app source.
  - 'AGENTS.md'
  # Codacy Lizard file-length is low signal for this integration-style UI test.
  # Local Vitest coverage and repo lint/type gates still cover it.
  - 'src/components/mit-sailing/admin/catalog/AdminCatalogRichText.test.tsx'
