---
# React TSX is covered by Codacy's Biome config in .biome.json.
exclude_paths:
  - '.next/**'
  - 'out/**'
  - 'coverage/**'
  - 'playwright-report/**'
  - 'blob-report/**'
  - 'test-results/**'
  - 'vitest-test-results/**'
  - 'storybook-static/**'
  - 'node_modules/**'
  - 'src/generated/**'
  - 'prisma/migrations/**'
