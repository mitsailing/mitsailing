---
exclude_paths:
  - '.next/**'
  - 'out/**'
  - 'coverage/**'
  - 'playwright-report/**'
  - 'blob-report/**'
  - 'test-results/**'
  - 'vitest-test-results/**'
  - 'storybook-static/**'
  - 'node_modules/**'
  - 'src/generated/**'
  - 'prisma/migrations/**'
engines:
  biome:
    exclude_paths:
      - 'src/**/*.tsx'
  metric:
    exclude_paths:
      # Lizard mis-parses TSX component bodies as duplicated global/method
      # complexity; ESLint and Opengrep still analyze these files.
      - 'src/**/*.tsx'
