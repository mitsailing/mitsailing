---
exclude_paths:
  - '.next/**'
  - 'out/**'
  - 'coverage/**'
  - 'playwright-report/**'
  - 'blob-report/**'
  - 'test-results/**'
  - 'vitest-test-results/**'
  - 'storybook-static/**'
  - 'node_modules/**'
  - 'src/generated/**'
  - 'prisma/migrations/**'
engines:
  biome:
    exclude_paths:
      - 'src/**/*.tsx'
  lizard:
    exclude_paths:
      # Lizard mis-parses TypeScript/TSX as duplicated global/method
      # complexity; ESLint, Sonar, and Opengrep still analyze these files.
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
  metric:
    exclude_paths:
      # Lizard mis-parses TypeScript/TSX as duplicated global/method
      # complexity; ESLint, Sonar, and Opengrep still analyze these files.
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
