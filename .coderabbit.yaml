# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Strict review defaults (assertive profile + request changes). Keep CodeRabbit
# as review/comment input; write-producing finishing touches are disabled below.
# Manual Autofix or stacked PR commands require an explicit user request.

language: en-US
early_access: false
inheritance: false

reviews:
  profile: assertive
  request_changes_workflow: true
  poem: false

  high_level_summary: true
  review_status: false
  review_details: true
  collapse_walkthrough: false

  # Publish CodeRabbit's GitHub PR status while keeping service/credit failures
  # non-blocking; agents still fix actionable CodeRabbit comments when a review
  # actually runs.
  commit_status: true
  fail_commit_status: false

  enable_prompt_for_ai_agents: true

  path_filters:
    - '!.agents/**'
    - '!.cursor/**'
    - '!docs/**'

  path_instructions:
    - path: '**/*.{ts,tsx}'
      instructions: >-
        Follow repository AGENTS.md and .cursor/rules: TypeScript strictness,
        React patterns (single props param, React Compiler handles routine memoization),
        Next.js App Router and server/client boundaries, next-intl (no hard-coded
        user-visible strings), and MIT theme token/readability rules. Do not suggest
        `useEffect` for user events, data transformation, derived state, or
        server-loadable data; it is an escape hatch for synchronizing with external
        systems.
        Do not suggest
        `React.cloneElement` to inject form/accessibility props; put `id`, `required`,
        `aria-required`, and related attributes directly on the actual input/select/
        textarea or shared control call site. For form event annotations, prefer
        inferred JSX handler types or the types accepted by installed React typings;
        do not churn between `FormEvent` and `SubmitEvent` unless local lint/types
        require it.
        Context7 Next.js App Router docs show `next/navigation` router push,
        replace, and refresh as imperative transition methods; do not request
        awaiting App Router navigation calls.
        Next.js 2026 guidance for this app is server-first App Router on a long-running
        Node host: prefer RSC/server data access, Server Actions for mutations,
        `connection()` for request-bound rendering instead of broad `force-dynamic`,
        explicit cache/revalidation choices, and Node runtime for Prisma/pg/FS.
        Do not suggest Pages Router patterns for new App Router code.
        For Next.js layout passthrough components, allow an explicit
        `React.ReactNode` return annotation when the configured linter requires
        an explicit return type to avoid inferred promise ambiguity.
        Better Auth server hooks intentionally throw stable `APIError` code/message
        tokens that the client maps to next-intl copy; Context7 Better Auth docs
        show `createAuthMiddleware` hooks throwing `APIError` with a `message`.
        Do not request `next-intl/server` translations inside Better Auth hook
        middleware unless a request locale is actually available at that boundary.
        Do not request changing FormData checkbox parsing from `getAll(...).includes("true")`
        to `get(...) === "true"` where forms render a hidden `false` input before
        the checkbox; direct `get` reads the hidden fallback and breaks checked
        browser payloads.
        CMS seed files are editorial bootstrap content, not component UI copy;
        do not request replacing seed titles, body copy, labels, or addresses
        with next-intl keys unless the render path has been explicitly changed
        to store translation keys instead of CMS content.
        CMS media routes are public by design because published page content
        references them directly; flag unsafe path traversal, MIME, cache, or
        storage bugs there, but do not request authentication solely because the
        file is served from `/cms-media/...`.
        `readCmsMediaFile` returns a Node Buffer while NextResponse's installed
        Next 16 typings accept BodyInit; keep the explicit Uint8Array body
        conversion unless local typings prove Buffer is assignable without casts.
        Sentry and the configured app log sinks are approved telemetry
        subprocessors under the service agreement: readable user IDs, emails,
        and auth diagnostic context are intentional in auth diagnostics. Do not
        request hashing, redaction, or removal of user IDs, emails, or auth
        error messages solely because they are PII.
        Rate-limit errors may include short wait guidance such as
        "Too many requests. Wait a few minutes."; this is intentional and is not
        a prohibited "try again" variant.
        Flag deviations and security-sensitive mistakes (auth, SQL, secrets).
        URL shape: `next.config.ts` does not set `trailingSlash: true`, so Next.js
        defaults to redirecting `/path/` to `/path` (no trailing slash on the
        pathname). For in-app links and Playwright `href` assertions to the same
        page plus a fragment, use `/path#fragment` (pathname `/path`, hash
        `fragment`). Do **not** suggest `/path/#fragment`—that implies a pathname
        ending in `/` before `#`, which fights the default and mismatches fleet
        and class rating links that use `/ratings` plus `#` and the slug.
        Localized app paths in server code: use `getI18nPath(path, locale)` from
        `@/utils/Helpers` for `revalidatePath` and similar; do not concatenate
        `/${locale}/...` (wrong shape with `localePrefix: 'never'`—locale is not in public URLs).
    - path: 'src/libs/mit-sailing/pavilionReservationPricing.ts'
      instructions: >-
        Pavilion reservation money is integer USD cents only (whole dollars in
        the UI). `null` in persona price maps means TBD/unset; `0` means
        complimentary/free — never conflate them. `priceForPersona` and
        `personaPriceDisplay` are the canonical resolvers. Service add-ons use
        flat persona unit pricing via `estimatedServiceAmountCents` (no slot
        duration proration); do not request hourly proration for services or
        rename tests to imply hourly service billing. Production catalog prices
        are whole-dollar cents; seed/bootstrap decimals are out of scope for
        this PR.
    - path: 'src/libs/mit-sailing/pavilionReservationPricing.test.ts'
      instructions: >-
        Tests document the null-vs-zero pricing contract. Service estimate tests
        should use `pricingType: 'flat'` unless product adds hourly service
        billing. Do not suggest expecting `null` for complimentary `0` prices.
    - path: 'src/data/mit-sailing/pavilionReservationCatalogSeed.ts'
      instructions: >-
        Seed/bootstrap catalog only; production pricing is edited in admin/DB.
        `pricingType` is only `hourly` or `flat` (billing shape). Negotiated
        Sailing Master fees use `flat` with null persona prices until rates are
        published (see GitHub issue #69). Do not block on republishing seed rows
        as `$0` flat fees when the description says fees are arranged separately.
    - path: 'src/libs/admin/pavilion-reservations/pavilionReservationAdminActions.ts'
      instructions: >-
        Pavilion reservation amounts are whole dollars only (admin inputs use
        `step="1"`). `wholeDollarsCentsOrNull` must use `Math.round(parsed) * 100`,
        not `Math.round(parsed * 100)` — fractional dollar input is rounded to the
        nearest whole dollar before storing cents. DB columns stay `*_cents` with
        values that are multiples of 100; do not request sub-cent pricing or
        renaming columns to dollars.
    - path: '.codacy.yaml'
      instructions: >-
        Do not restore a blanket `**/*.tsx` exclusion. Codacy analyzes React TSX
        through Biome with React enabled and Qwik/Solid disabled in `.biome.json`.
        If Codacy flags framework-specific TSX noise, adjust that tool config
        instead of hiding app-owned TSX from analysis.
    - path: '.biome.json'
      instructions: >-
        Codacy-only Biome config for React TSX; do not require local Biome deps.
    - path: 'src/app/[[]locale[]]/**'
      instructions: >-
        Single-locale English site (`AppConfig.i18n.locales` is only `en`).
        next-intl keys are not a reason to introduce multi-locale URL prefixes or
        `/en/...` in public paths. The `src/app/[locale]/` segment is intentional
        for next-intl + proxy routing; do not suggest removing it as cleanup without
        an explicit full migration off next-intl routing. For server pages here,
        prefer `await props.params`, `setRequestLocale(locale)`, and
        `getTranslations({ locale, namespace })` over a module-level
        `AppConfig.i18n.defaultLocale` for consistency. For `revalidatePath` and
        link targets, use `getI18nPath` from `@/utils/Helpers`, not `/${locale}/...`.
    - path: '**/*.{test,spec,e2e}.{ts,tsx}'
      instructions: >-
        Do not flag lowercase `it(...)` titles. This repository accepts concise
        lowercase verb-phrase test titles such as "redacts provider auth client error
        messages"; enforce no trailing period and clear behavior wording instead.
        The `UserProfilePage.sign_out_all_error` copy intentionally includes
        "Try again."; do not request removing it from assertions or UI.
        Rate-limit assertions may expect "Wait a few minutes." copy; do not
        request shortening it solely under the no "try again" rule.
        When asserting `href` on same-origin links with hash targets (e.g. ratings
        anchors), expect `/ratings#slug` not `/ratings/#slug` unless the project
        explicitly enables `trailingSlash: true` (it does not). See the general
        `**/*.{ts,tsx}` path_instructions URL shape note.
    - path: 'src/locales/en.json'
      instructions: >-
        The `UserProfilePage.sign_out_all_error` copy intentionally reads
        "Could not revoke other sessions. Try again."; do not request removing
        "Try again." from this key. Rate-limit messages may say "Wait a few
        minutes." because this is direct wait guidance, not a "try again" variant.
    - path: 'prisma/**'
      instructions: >-
        Validate Prisma schema and migrations for naming consistency, safe evolves,
        and relation integrity; align with project migration practices. CMS media
        uploads are capped by application validation at 10 MiB, so `byte_size`
        using an integer is intentional unless the upload cap or storage contract
        changes. Catalog history stores the Fleet admin resource under
        auditable_type/resource `fleet`, matching `CatalogHistoryResourceId`, not
        the physical `fleet_boats` table name. `StaffMember.id` is app-assigned
        from the staff slug in seed code; do not request `@default(cuid())`
        unless a real `staffMember.create` call omits an id.
    - path: 'zenstack/schema.ts'
      instructions: >-
        This file is generated from `zenstack/schema.zmodel`; do not request
        direct edits here. For `SailingCardMembershipPrice`, enum catalog-key
        immutability is intentionally enforced by the migration trigger because
        ZenStack `before()` comparisons for Postgres enum fields generate invalid
        enum/text SQL in this model. Do not request adding enum `before()`
        comparisons to the ZenStack post-update policy unless local generation
        and tests prove the SQL is valid. ZenStack field-level policies cannot be
        applied to relation fields; creator FK scalar fields remain read-denied,
        and public app/API surfaces must avoid exposing creator relations.
    - path: 'compose.prod.yaml'
      instructions: >-
        Production CMS media intentionally uses a fixed in-container path:
        `CMS_MEDIA_ROOT=/var/lib/mitsailing/cms-media`, with the external
        Docker volume `mitsailing_cms_media` mounted at that same literal target
        for app and worker. Do not request making this path env-overridable in
        production compose; deploy.sh owns volume creation, permissions, and
        mount verification for this contract.
    - path: '.github/workflows/**'
      instructions: >-
        Check workflows for CI best practices, secrets handling, and consistency with
        docs and npm scripts in package.json.

  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    drafts: false
    ignore_title_keywords:
      - WIP
      - DO NOT MERGE
      - DRAFT
    base_branches:
      - main
      - develop
      - release/.*

  finishing_touches:
    # Keep CodeRabbit in review/comment mode only. Write-producing finishing
    # touches can create follow-up PRs or direct commits from checkbox clicks.
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    custom: []

  pre_merge_checks:
    docstrings:
      mode: off
    title:
      mode: warning
      requirements: >-
        Prefer Conventional Commits-style titles (feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert): short specific summary.
    description:
      mode: warning
    issue_assessment:
      mode: warning
    custom_checks:
      - name: Package-first infrastructure decision
        mode: error
        instructions: >-
          Fail only when both conditions are true. Condition 1: the PR adds or
          substantially changes custom package-like infrastructure for
          auth/authorization, policy/access control, generated CRUD, table or form
          engines, validation/resolver layers, audit/history, queues or
          orchestration, calendar/date engines, or file/media pipelines. Condition
          2: neither the PR description nor changed planning/design documentation
          records a package/local-pattern decision with one of these forms:
          "Using existing pattern/package X because ...", "Using package X because
          ...", or "No package because ...". Pass if the PR only uses an existing
          local abstraction, only changes application-specific business logic, only
          updates UI/copy/tests/docs, or already documents the decision. When
          failing, name the custom subsystem and request the missing
          package/local-pattern decision; do not require adopting a package when a
          documented local-pattern decision exists.

  tools:
    # Lint stack matches package.json (ultracite / oxlint); no ESLint config in-repo.
    eslint:
      enabled: false
    biome:
      enabled: false
    oxc:
      enabled: true
    prismaLint:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    github-checks:
      enabled: true

chat:
  auto_reply: true
