# SonarQube Server 2026.1 / SonarQube Cloud analysis defaults.
sonar.projectKey=mitsailing
sonar.projectName=mitsailing
sonar.sourceEncoding=UTF-8

# Keep source and test scopes explicit. Co-located tests are classified by test inclusions.
sonar.sources=src,emails,prisma,scripts,.github
sonar.tests=tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,tests/**/*.spec.ts,tests/**/*.e2e.ts

# Build outputs, dependency folders, and generated reports are never analysis input.
sonar.exclusions=**/node_modules/**,.next/**,out/**,coverage/**,playwright-report/**,blob-report/**,test-results/**,vitest-test-results/**,storybook-static/**,prisma/migrations/**,src/data/**

# Vitest emits LCOV here via `npm run test:coverage`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage should measure app code, not tooling, generated artifacts, or tests.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,tests/**,scripts/**,prisma/**,.github/**,src/test/**,**/*.config.ts,**/*.config.mts,**/*.config.mjs

# Migration/seed/test duplication is low signal for the PR quality gate.
sonar.cpd.exclusions=prisma/migrations/**,src/data/**,**/*.test.ts,**/*.test.tsx,tests/**
