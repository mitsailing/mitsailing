# Local-dev overlay — auto-loaded by Docker Compose when `compose.yaml` is
# in the same directory. Adds:
#   - host port bindings so the app running on the laptop can reach the
#     services at 127.0.0.1:<POSTGRES_PUBLISH_PORT> / <MAILPIT_SMTP_PUBLISH_PORT> /
#     <MAILPIT_HTTP_PUBLISH_PORT> (defaults in `.env.example`; Compose reads `.env`).
#   - Mailpit for email capture (no auth — loopback-only).
#   - tusd + media nginx for production-like CMS uploads/media on loopback.
#
# Notably does NOT start the Next.js app container. Local workflow runs
# `npm run dev` on the host so HMR, source maps, and IDE integration all
# work the way they already do. Flip to the dev container only if you
# actively want to exercise the Dockerfile's `dev` stage.

services:
  postgres:
    ports:
      # Host port defaults to 5432; override via POSTGRES_PUBLISH_PORT in `.env`
      # when another Postgres already owns 5432 (Homebrew, another container).
      - '${POSTGRES_PUBLISH_PORT:-5432}:5432'

  redis:
    ports:
      # For `npm run worker:dev` on the host. Production leaves Redis unpublished.
      - '127.0.0.1:${REDIS_PUBLISH_PORT:-6379}:6379'

  mailpit:
    image: axllent/mailpit:v1.30.1
    restart: unless-stopped
    ports:
      # Container keeps 1025/8025; host side overridable when 1025/8025 are taken.
      - '127.0.0.1:${MAILPIT_SMTP_PUBLISH_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_HTTP_PUBLISH_PORT:-8025}:8025'
    environment:
      MP_MAX_MESSAGES: '5000'
      MP_MAX_AGE: 7d
      MP_DATABASE: /data/mailpit.db
      # Local dev binds Mailpit to loopback only and accepts anything
      # — never do either in a shared environment (see .env.staging.example).
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    volumes:
      - mailpit_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://localhost:8025/readyz',
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  tusd:
    image: tusproject/tusd:v2.9.2
    user: '${LOCAL_DOCKER_UID:-1000}:${LOCAL_DOCKER_GID:-1000}'
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MEDIA_UPLOAD_PUBLISH_PORT:-1080}:1080'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command:
      - -port=1080
      - -upload-dir=/var/lib/mitsailing/cms-media/uploads
      - -base-path=/cms-media/uploads/
      - -disable-download
      - -behind-proxy
      - -max-size=${MEDIA_UPLOAD_MAX_BYTES:-104857600}
      - -hooks-http=${MEDIA_UPLOAD_HOOK_URL:-http://host.docker.internal:3000/api/internal/cms-media/tusd/hooks}
      - -hooks-http-forward-headers=x-mitsailing-upload-token
      - -cors-allow-origin=${MEDIA_UPLOAD_CORS_ALLOW_ORIGIN:-${NEXT_PUBLIC_APP_URL:-http://localhost:3000}}
      - -cors-allow-headers=authorization,content-type,tus-resumable,upload-length,upload-metadata,upload-offset,x-mitsailing-upload-token
      - -cors-expose-headers=location,tus-resumable,upload-offset,upload-length,upload-metadata,upload-expires
    volumes:
      - type: bind
        source: ./local/cms-media
        target: /var/lib/mitsailing/cms-media
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '-O',
          '/dev/null',
          'http://127.0.0.1:1080/metrics',
        ]
      interval: 2s
      timeout: 5s
      start_period: 30s
      retries: 30

  media:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MEDIA_PUBLIC_PUBLISH_PORT:-8088}:8080'
    volumes:
      - type: bind
        source: ./docker/nginx/media.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./local/cms-media
        target: /var/lib/mitsailing/cms-media
        bind:
          create_host_path: false
        read_only: true
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:8080/cms-media/healthz',
        ]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  mailpit_data:
