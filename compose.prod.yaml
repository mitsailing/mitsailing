# Production overlay for the MIT Sailing stack.
#
# WordPress runs in its own compose/tunnel and is intentionally not referenced here.
#
# Bring up with:
#   docker compose -f compose.yaml -f compose.prod.yaml --profile release --env-file .env.production --env-file .env.image up -d
#
# Persistent state uses host bind mounts under PRODUCTION_DATA_ROOT
# (/srv/mitsailing-data by default) so `docker compose down -v` cannot remove
# production data. Missing production bind paths fail fast instead of being
# auto-created by Docker Compose.

x-web: &web
  image: ${APP_IMAGE}
  profiles: ['release']
  restart: unless-stopped
  networks:
    - internal
  security_opt:
    - no-new-privileges:true
  env_file:
    - path: .env.production
      required: false
    - path: .env.image
      required: false
  environment:
    CMS_MEDIA_ROOT: /var/lib/mitsailing/cms-media
    MEDIA_STORAGE_ROOT: /var/lib/mitsailing/cms-media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    mailpit:
      condition: service_healthy
  volumes:
    - type: bind
      source: ${PRODUCTION_DATA_ROOT:-/srv/mitsailing-data}/cms-media
      target: /var/lib/mitsailing/cms-media
      bind:
        create_host_path: false
      read_only: true
  stop_grace_period: 30s
  command: ['node', 'server.js']
  deploy:
    resources:
      limits:
        cpus: '1.0'
        memory: 1536M
      reservations:
        cpus: '0.25'
        memory: 512M
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'

services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mitsailing_prod}
    volumes:
      - type: bind
        source: ${PRODUCTION_DATA_ROOT:-/srv/mitsailing-data}/postgres
        target: /var/lib/postgresql
        bind:
          create_host_path: false
      - type: bind
        source: ./docker/postgres/init.sql
        target: /docker-entrypoint-initdb.d/00-init.sql
        read_only: true

  redis:
    volumes:
      - type: bind
        source: ${PRODUCTION_DATA_ROOT:-/srv/mitsailing-data}/redis
        target: /data
        bind:
          create_host_path: false

  app:
    image: nginx:1.29-alpine
    restart: unless-stopped
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    depends_on:
      mailpit:
        condition: service_healthy
      pghero:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./.deploy/nginx
        target: /etc/nginx/conf.d
        read_only: true
    healthcheck:
      # deploy.sh smoke-checks the selected web_* upstream before starting or
      # reloading this proxy, so this proxied liveness check should only run
      # after nginx has a healthy target.
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider http://127.0.0.1:3000/api/health/live',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  web_blue:
    <<: *web

  web_green:
    <<: *web

  worker:
    image: ${APP_IMAGE}
    restart: unless-stopped
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'node', 'worker-redis-healthcheck.cjs']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    env_file:
      - path: .env.production
        required: false
      - path: .env.production.worker
        required: false
      - path: .env.image
        required: false
    environment:
      CMS_MEDIA_ROOT: /var/lib/mitsailing/cms-media
      MEDIA_STORAGE_ROOT: /var/lib/mitsailing/cms-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${PRODUCTION_DATA_ROOT:-/srv/mitsailing-data}/cms-media
        target: /var/lib/mitsailing/cms-media
        bind:
          create_host_path: false
    stop_grace_period: 30s
    command: ['node', 'worker.mjs']
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  mailpit:
    image: axllent/mailpit:v1.30.1
    restart: unless-stopped
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    environment:
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-10000}
      MP_MAX_AGE: ${MAILPIT_MAX_AGE:-30d}
      MP_DATABASE: /data/mailpit.db
      MP_WEBROOT: /mail/
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:?set MAILPIT_UI_AUTH}
      MP_SMTP_RELAY_HOST: ${MAILPIT_SMTP_RELAY_HOST:-smtp.resend.com}
      MP_SMTP_RELAY_PORT: ${MAILPIT_SMTP_RELAY_PORT:-587}
      MP_SMTP_RELAY_STARTTLS: ${MAILPIT_SMTP_RELAY_STARTTLS:-true}
      MP_SMTP_RELAY_AUTH: ${MAILPIT_SMTP_RELAY_AUTH:-plain}
      MP_SMTP_RELAY_USERNAME: ${MAILPIT_SMTP_RELAY_USERNAME:-resend}
      MP_SMTP_RELAY_PASSWORD: ${RESEND_API_KEY:?set RESEND_API_KEY}
      MP_SMTP_RELAY_MATCHING: ${MAILPIT_SMTP_RELAY_MATCHING:?set MAILPIT_SMTP_RELAY_MATCHING}
    volumes:
      - type: bind
        source: ${PRODUCTION_DATA_ROOT:-/srv/mitsailing-data}/mailpit
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider "http://127.0.0.1:8025$${MP_WEBROOT:-/}readyz"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  pghero:
    image: ankane/pghero:v3.8.0
    restart: unless-stopped
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: ${PGHERO_DATABASE_URL:?set PGHERO_DATABASE_URL}
      PGHERO_USERNAME: ${PGHERO_USERNAME:?set PGHERO_USERNAME}
      PGHERO_PASSWORD: ${PGHERO_PASSWORD:?set PGHERO_PASSWORD}
      RAILS_RELATIVE_URL_ROOT: /pghero
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'ruby -rnet/http -e ''exit Net::HTTP.get_response(URI("http://127.0.0.1:8080#{ENV.fetch("RAILS_RELATIVE_URL_ROOT", "")}/health")).code == "200" ? 0 : 1''',
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
        reservations:
          cpus: '0.05'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  tusd:
    image: tusproject/tusd:v2.9.2
    user: '1001:1001'
    restart: unless-stopped
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: .env.production
        required: false
    command:
      - -port=1080
      - -upload-dir=/var/lib/mitsailing/cms-media/uploads
      - -base-path=/cms-media/uploads/
      - -disable-download
      - -behind-proxy
      - -max-size=${MEDIA_UPLOAD_MAX_BYTES:-104857600}
      - -hooks-http=${TUSD_HOOKS_HTTP_URL:?set TUSD_HOOKS_HTTP_URL}
      - -hooks-http-forward-headers=x-mitsailing-upload-token
      - -cors-allow-origin=${MEDIA_UPLOAD_CORS_ALLOW_ORIGIN:-https://mitsailing.com}
      - -cors-allow-headers=authorization,content-type,tus-resumable,upload-length,upload-metadata,upload-offset,x-mitsailing-upload-token
      - -cors-expose-headers=location,tus-resumable,upload-offset,upload-length,upload-metadata,upload-expires
    volumes:
      - type: bind
        source: ${PRODUCTION_DATA_ROOT:-/srv/mitsailing-data}/cms-media
        target: /var/lib/mitsailing/cms-media
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '-O',
          '/dev/null',
          'http://127.0.0.1:1080/metrics',
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  media:
    image: nginx:1.29-alpine
    restart: unless-stopped
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./docker/nginx/media.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ${PRODUCTION_DATA_ROOT:-/srv/mitsailing-data}/cms-media
        target: /var/lib/mitsailing/cms-media
        bind:
          create_host_path: false
        read_only: true
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --tries=1 --spider http://127.0.0.1:8080/cms-media/healthz',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  cloudflared:
    image: cloudflare/cloudflared:2026.5.2
    restart: unless-stopped
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    command:
      - tunnel
      - --autoupdate-freq
      - 24h
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
      media:
        condition: service_healthy
      tusd:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
