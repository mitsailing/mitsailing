# Production overlay — scaffolded for the eventual prod stack. Key
# differences from staging:
#   - No Mailpit service: outbound mail goes to Resend
#     (MAIL_TRANSPORT=resend via .env.production).
#   - App command is `node server.js`; database migrations run in CI/CD
#     before deployment (see `.github/workflows/deploy.yml`).
#   - Database default name `mitsailing_prod` (override with POSTGRES_DB if
#     an existing volume was initialized with `dev_db`).
#   - If heavy ISR / `use cache` needs a shared or durable data cache, add a
#     named volume on `app` for the Next data directory (see Next.js
#     self-hosting) or a custom `incrementalCacheHandlerPath` — not enabled by
#     default.
#
# Bring up with:
#   docker compose -f compose.yaml -f compose.prod.yaml --env-file .env.production up -d
#
# Optional loopback DB port for SSH tunnel admin (see compose.db-admin.yaml):
#   docker compose -f compose.yaml -f compose.prod.yaml -f compose.db-admin.yaml --env-file .env.production up -d
#
# Worker reuses the app image; `worker.healthcheck` runs `worker-redis-healthcheck.cjs` (see Dockerfile) instead of the image HTTP probe.

services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mitsailing_prod}

  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    networks:
      - internal
    env_file:
      - path: .env.production
        required: false
      - path: .env.production.worker
        required: false
    environment:
      CMS_MEDIA_ROOT: /var/lib/mitsailing/cms-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - type: volume
        source: cms_media
        target: /var/lib/mitsailing/cms-media
    stop_grace_period: 30s
    command: ['node', 'server.js']
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  worker:
    image: ${APP_IMAGE}
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'node', 'worker-redis-healthcheck.cjs']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    env_file:
      - path: .env.production
        required: false
    environment:
      CMS_MEDIA_ROOT: /var/lib/mitsailing/cms-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - type: volume
        source: cms_media
        target: /var/lib/mitsailing/cms-media
    stop_grace_period: 30s
    command: ['node', 'worker.cjs']
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    networks:
      - internal
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  cms_media:
    name: mitsailing_cms_media
    external: true
