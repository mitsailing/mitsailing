# Staging overlay — runs on the office Linux box (sailing-dock.mit.edu)
# under rootless Docker. Bring up with:
#
#   docker compose -f compose.yaml -f compose.staging.yaml --env-file .env.staging up -d
#
# The stack:
#   - app         : our image, pulled from GHCR, configured via .env.staging
#   - postgres    : inherited from compose.yaml, no host ports exposed
#   - mailpit     : captures outbound email, UI protected by HTTP basic auth
#   - cloudflared : Cloudflare Tunnel providing HTTPS ingress without
#                   opening inbound firewall ports on the host
#
# Why no host port bindings on app/mailpit: the server is behind MIT's
# campus network with no inbound NAT rule; all traffic enters through the
# tunnel. Cloudflared resolves service names via the docker network, so
# mitsailing.com → app:3000 and mail.mitsailing.com → mailpit:8025 both
# work without any host-port routing.

services:
  app:
    # CI publishes per-commit tags plus the floating `:staging`. The env
    # example defaults to :staging; pin to a SHA for rollbacks.
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file:
      - path: .env.staging
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    # Run migrations before the app starts so a bad migration stops
    # deploys cold rather than silently mis-serving traffic.
    command:
      - sh
      - -c
      - >-
        npx prisma migrate deploy && node server.js
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    env_file:
      - path: .env.staging
        required: false
    environment:
      MP_MAX_MESSAGES: '5000'
      MP_DATABASE: /data/mailpit.db
      # In staging the only clients sending mail are our own app + QA
      # manually poking the SMTP port via cloudflared. Mailpit's
      # auth-by-HTTP-basic guards the UI; SMTP stays open on the internal
      # network only.
      MP_UI_AUTH: ${MAILPIT_UI_AUTH}
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    volumes:
      - mailpit_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://localhost:8025/readyz',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # `tunnel run` reads its config from the token alone — the hostnames
    # (mitsailing.com, mail.mitsailing.com) are configured in the
    # Cloudflare dashboard, not here. Keeping them off the host means we
    # don't accidentally expose them via `docker compose ps` output.
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
      - mailpit
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  mailpit_data:
